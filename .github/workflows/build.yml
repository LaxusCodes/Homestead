name: build

# Builds the plugin on every push/PR and turns version tags (v*) into releases
# with Homestead.jar + the zipped resource pack attached.

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

env:
  # one bump per workflow run (= per commit build), e.g. 0.1.42; overrides pom's 0.1.0 local default
  PLUGIN_VERSION: 0.1.${{ github.run_number }}

jobs:
  build:
    name: Build plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Verify resource pack (legacy + 1.21.4+ definitions, HUD font)
        run: |
          pip install pillow pyyaml numpy
          python Homestead-Plugin-src/homestead/tools/verify_pack.py Realism-ResourcePack-Homestead-v6 Homestead-Plugin-src/homestead/src/main/resources/config.yml

      - name: Build with Maven (version ${{ env.PLUGIN_VERSION }})
        working-directory: Homestead-Plugin-src/homestead
        run: mvn -B clean package "-Dhomestead.version=${{ env.PLUGIN_VERSION }}"

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: Homestead-${{ env.PLUGIN_VERSION }}
          path: Homestead-Plugin-src/homestead/target/Homestead.jar
          if-no-files-found: error

  release:
    name: Attach release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download built jar
        uses: actions/download-artifact@v4
        with:
          name: Homestead-${{ env.PLUGIN_VERSION }}
          path: dist

      - name: Zip resource pack (reproducible: pack.mcmeta at zip root)
        run: |
          cd Realism-ResourcePack-Homestead-v6
          find . -type f -exec touch -d '2026-01-01 00:00:00' {} +
          find . -type f | LC_ALL=C sort | zip -X -q "../Homestead-ResourcePack-${{ github.ref_name }}.zip" -@

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Homestead.jar
            Homestead-ResourcePack-*.zip

  publish:
    # every push to main refreshes a rolling 'latest' release with the raw jar
    # (release assets are plain files, unlike artifacts which GitHub always zip-wraps on download)
    name: Publish latest jar + pack
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download built jar
        uses: actions/download-artifact@v4
        with:
          name: Homestead-${{ env.PLUGIN_VERSION }}
          path: dist

      - name: Zip resource pack (reproducible: pack.mcmeta at zip root)
        run: |
          cd Realism-ResourcePack-Homestead-v6
          find . -type f -exec touch -d '2026-01-01 00:00:00' {} +
          find . -type f | LC_ALL=C sort | zip -X -q ../dist/Homestead-ResourcePack.zip -@

      - name: Replace the rolling 'latest' release
        env:
          GH_TOKEN: ${{ github.token }}
          # the publish job has no checkout; tell gh which repository it is talking to
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          sha1sum dist/Homestead-ResourcePack.zip | cut -d' ' -f1 > dist/pack_sha1.txt
          PACK_SHA1=$(cat dist/pack_sha1.txt)
          gh release delete latest --yes --cleanup-tag || true
          sleep 3
          gh release create latest dist/Homestead.jar dist/Homestead-ResourcePack.zip \
            --title "Latest build (0.1.$RUN)" \
            --notes "Built from commit $SHA by the CI (version 0.1.$RUN). Drop Homestead.jar straight into plugins/.

          Resource pack: Homestead-ResourcePack.zip (pack.mcmeta at the zip root).

          server.properties:
          \`\`\`
          resource-pack=https://github.com/LaxusCodes/Homestead/releases/download/latest/Homestead-ResourcePack.zip
          resource-pack-sha1=$PACK_SHA1
          \`\`\`"
