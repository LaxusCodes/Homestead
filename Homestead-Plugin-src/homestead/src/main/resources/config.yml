      time: 10
      servings: 3
      effects: ["resistance:20:0"]
      thirst: 3
      warmth: 180
    chicken_soup:
      name: "<yellow>Chicken Soup"
      model: "farmersdelight:item/chicken_soup"
      cmd: 1003
      base: MUSHROOM_STEW
      ingredients: { CHICKEN: 1, CARROT: 1, POTATO: 1 }
      time: 14
      servings: 3
      effects: ["regeneration:10:0", "absorption:60:0"]
