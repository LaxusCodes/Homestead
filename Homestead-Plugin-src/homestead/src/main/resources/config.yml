decor:
  # base item is PAPER so furniture can't be placed as a block or eaten.
  # cmd = custom model data number, model = model shown (used by tools/gen_pack.py).
  # scale = display size. width/height = click hitbox (spawned at the vertical center of the model).
  # seat-height = rider offset (tune if sitting looks off). display-y = small manual nudge of the model.
  # Functions (right-click, no sneak; sneak + right-click picks the piece up again):
  #   storage-rows: N  -> cabinets / baskets / bale open a real storage GUI, saved on the furniture itself
  #   station: stove   -> feed it fuel, grill raw food, warms nearby players, heats a pot beside it
