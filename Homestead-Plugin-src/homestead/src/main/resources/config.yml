wine:
  # 1) cook a must in the pot  2) open a barrel and put must bottles inside  3) wait
  # The timer starts the moment the bottles land in the barrel and counts down live on the action bar
  # (progress bar, percent, time left) while the barrel is open. It keeps running when you close it.
  # When time is up, the bottles turn into wine right inside the barrel. No special right-click storing.
  ferment-ticks: 12000    # 20 ticks = 1 second. 12000 = 10 minutes (server running time)
  types:
    berry_wine:
      from: berry_must
      name: "<dark_purple>Sweet Berry Wine"
      model: "homestead:item/wine_berry"
      cmd: 3101
      base: HONEY_BOTTLE
      nausea: 12          # seconds of Nausea; stacks if you keep drinking
