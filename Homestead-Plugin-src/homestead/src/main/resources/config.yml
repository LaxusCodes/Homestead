stove:
  # Right-click a Stove with fuel to light it. It burns by time (it keeps burning if you leave).
  max-seconds: 600          # a stove never holds more than this much fuel
  grill-seconds: 3          # how long grilling one item takes
  fuel-seconds:             # seconds of heat per item. LOGS / PLANKS match every wood type
    COAL: 90
    CHARCOAL: 90
    COAL_BLOCK: 900
    BLAZE_ROD: 180
    DRIED_KELP_BLOCK: 180
    STICK: 6
    LOGS: 40
    PLANKS: 10
  grill:                    # raw item -> grilled item (right-click a LIT stove holding the raw item)
    BEEF: COOKED_BEEF
    PORKCHOP: COOKED_PORKCHOP
    CHICKEN: COOKED_CHICKEN
    MUTTON: COOKED_MUTTON
    RABBIT: COOKED_RABBIT
