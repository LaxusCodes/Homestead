# Homestead - cozy survival for Paper 1.21.1+
# Needs the Realism / Farmer's Delight resource pack for custom food and furniture models.

# Leave empty to enable in all worlds, or list world names.
enabled-worlds: []

# Turn whole features on/off (applied on /homestead reload)
crafting:
  # Every furniture piece and the Golden Leaf are craftable out of the box.
  # Override any of them (or add extra recipes) here; key = recipe name, and add
  # "result" to target something else: decor:<id>, backpack, backpack:<skin>, golden_leaf.
  auto-decor: true    # auto-register the default furniture/golden leaf recipes
  auto-meals: true    # every cooked meal and must can also be made at a crafting table (1 serving; the pot makes several)
  auto-meals-skip:    # ids that must NOT get a crafting-table shortcut: water has to be boiled in a pot
    - boiled_water
  auto-wine: true     # wine can be crafted from 3 must bottles (a costly shortcut around the barrel)
  recipes:
    oak_chair:
      shape: ["WW", "SS"]
      ingredients: { W: OAK_PLANKS, S: STICK }

modules:
  survival: true   # seasons, temperature, thirst
  farming: true    # seasonal crop growth
  cooking: true    # cooking pot (cauldron on lit campfire)
  quests: true     # quest chains from quests.yml
  decor: true      # chairs, rugs, mats, cabinets
  wine: true       # barrel fermentation + wine
  backpack: true   # portable storage
  artifacts: true  # Golden Leaf relic
  crafting: true   # crafting-table recipes for furniture and items

hud:
  enabled: true    # action bar: thirst, season, temperature
  style: icons     # icons (needs the resource pack) or text
  labels: false    # also show the season/temperature words next to the icons
  # Layout (icons style). Everything is relative to the action bar line, which is anchored to the
  # bottom of the screen, so it looks the same at every GUI scale.
  #   thirst bar  = exactly the hunger bar's width, in the row directly ABOVE the hunger icons
  #   temperature + season = same row, on the right (towards the screen corner)
  # Vertical offsets are "ascent" values baked into the pack font: -16 = the row above hunger.
  # Changing them needs a pack rebuild:
  #   python tools/make_assets.py <pack-folder> src/main/resources/config.yml
  thirst-ascent: -16
  temp-ascent: -16
  # px from the screen centre to the RIGHT edge of the temperature bar. Raise it to push the
  # temperature + season icons further towards the right corner (minimum 140).
  temp-right: 140

seasons:
  days-per-season: 7   # in-game days (a day = 20 real minutes). Day 0 = start of Spring

thirst:
  enabled: true
  drain-per-minute: 1.0     # out of 20 - a full bar lasts 20 minutes of normal play. Old 1.2 configs are auto-upgraded.
  sprint-multiplier: 1.2    # sprinting drains a bit faster (1 or less = no extra drain)
  heat-multiplier: 1.25     # extra drain while the temperature bar reads Hot - deserts no longer dry you out in minutes (1 or less = off)
  water-bottle: 6.0         # an unboiled (vanilla) water bottle; risk of poison, see below
  water-source: 2.0         # sneak + right-click on water with an empty hand
  dirty-water-chance: 0.35  # chance that unboiled water (straight from the source OR a vanilla water
                            # bottle) gives you Poison for 5s. Only water boiled in a cooking pot is clean.

temperature:
  enabled: true
  cold-below: 0.1     # effective temperature. Plains = 0.8, taiga = 0.25, desert = 2.0
  hot-above: 1.2
  night-drop: 0.25
  freeze-ticks: 100   # strength of the frost overlay (no damage). Skipped near fire, in leather, or after hot meals

farming:
  greenhouse-light: 12   # block light level that counts as a heated greenhouse (ignores winter slowdown)
  seasons:               # <1.0 = chance growth is allowed, >1.0 = chance of a bonus stage
    spring: 1.4
    summer: 1.0
    autumn: 1.0
    winter: 0.25

cooking:
  # cmd = custom model data number, model = model path shown (both used by tools/gen_pack.py).
  # base = vanilla food it behaves like. effects = "effect:seconds:amplifier".
  # thirst = restored thirst. warmth = seconds immune to cold. container defaults to BOWL.
  # servings = how many portions one pot makes. Pot: cauldron on a lit campfire, stir with a stick.
