    HAY_BLOCK: WHEAT:9

backpack:
  # A backpack is a textured CHESTPLATE (default base: chainmail; the vanilla armour bonus is wiped
  # so it protects nothing). One item = one unique id; its contents live inside the item.
  # The pack's transparent chainmail equipment texture hides the gray body layer while worn -
  # real chainmail chestplates/helmets are invisible to pack users too (see README).
  # Recipe: leather x7 + string + chest (shape LSL / LCL / LLL).
  # Re-skin: put a backpack + a dye in the crafting grid (contents are kept).
  # Wearing the pack in the chest slot shows its 3D model on your back; you never see it yourself
  # in first person (or F5), other players always do.
  # Open it: right-click with the pack in hand, or sneak + right-click with an empty hand while wearing.
  # worn-mode: equipment = real armour layer via the equippable component (Minecraft 26.x, needs the
  #                        homestead:backpack_<skin> equipment assets from the resource pack). Shows in F5,
  #                        never in first person, exactly like a chestplate. No entities, no tricks.
  #            display   = legacy 3D ItemDisplay on the back (hide-* options below only apply here).
  worn-mode: equipment
  rows: 3
  upgrades:             # backpack + <amount> of the material = one more row (3 -> 4 -> 5 -> 6). Order = tier 1, 2, 3
    items: [IRON_INGOT, GOLD_INGOT, DIAMOND]
    amount: 4
  base: CHAINMAIL_CHESTPLATE
  default-skin: classic
  show-on-back: true
  hide-from-self: false   # true = the wearer NEVER sees their own pack (any camera). Default false: the
                          # pack shows in F5/back view, and the pitch limit below handles steep first-person looks
  hide-when-looking-down: 35  # degrees of downward pitch past which the wearer stops seeing their own pack
                          # (first person looking down, F5 too). 0 accepts the plugin default of 35;
                          # a negative number turns this off so the pack is visible to the wearer always.
                          # Other players always see your pack either way.
  back:             # tune if the worn backpack floats or sinks into the player
    scale: 0.9
    x: 0.0
    y: -0.80        # up/down (negative = lower); -0.80 sits the pack on the torso, clear of the head
    z: -0.27       # distance from the body centre. NEGATIVE = behind the player, positive = in front
  skin-dyes:
    BROWN_DYE: classic
    RED_DYE: explorer
    BLACK_DYE: shadow
    ORANGE_DYE: camper
    GREEN_DYE: forest
  skins:
    classic:
      name: "<gold>Backpack"
      cmd: 4001
      model: "homestead:item/backpack_classic"
    explorer:
      name: "<red>Explorer Backpack"
      cmd: 4003
      model: "homestead:item/backpack_explorer"
    shadow:
      name: "<dark_gray>Shadow Backpack"
      cmd: 4004
      model: "homestead:item/backpack_shadow"
    camper:
      name: "<gold>Camper Backpack"
      cmd: 4005
      model: "homestead:item/backpack_camper"
    forest:
      name: "<green>Forest Backpack"
      cmd: 4006
      model: "homestead:item/backpack_forest"

